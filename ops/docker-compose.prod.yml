# FilsPay on the Dilmune server "S^2" (1 vCPU / 2 GB RAM / 50 GB SSD). The whole stack runs on
# this one machine: Postgres, api, settlement daemon, reporting worker, and Caddy (HTTPS + the
# built web and admin apps). Only Caddy publishes ports (80/443); everything else is on the
# internal Docker network.
#
# Secrets are NOT in this file: ops/.env.prod (git-ignored) is created by ops/deploy.sh with fresh
# random values on first run. Run from the repo root:
#   docker compose -f ops/docker-compose.prod.yml --env-file ops/.env.prod up -d --build
#
# Memory budget (2 GB box, plus 2 GB swap added by deploy.sh):
#   postgres 512M + api 384M + reporting 256M + settlement 128M + caddy 64M = ~1.3 GB

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: filspay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ops/deploy.sh to create ops/.env.prod}
      POSTGRES_DB: filspay
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
    # Tuned down for a 2 GB machine shared with the app.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=60", "-c", "work_mem=4MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 0.5

  migrate:
    build: { context: .., dockerfile: ops/Dockerfile.node }
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # One-off, FIRST deploy only (it TRUNCATES tables): docker compose ... --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build: { context: .., dockerfile: ops/Dockerfile.node }
    command: ["npm", "run", "seed"]
    environment:
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY}
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  api:
    build: { context: .., dockerfile: ops/Dockerfile.node }
    restart: unless-stopped
    command: ["npx", "tsx", "apps/api/src/index.ts"]
    environment:
      # "Demo mode": NODE_ENV stays development so the login page can show the one-time code
      # (the server has no email/SMS). Everything that matters for safety is set explicitly:
      # fresh secrets below, secure (HTTPS-only) cookies.
      NODE_ENV: development
      OTP_DEV_EXPOSE: "true"
      COOKIE_SECURE: "true"
      PORT: "3000"
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      ACQUIRER_CALLBACK_SIGNING_SECRET: ${ACQUIRER_CALLBACK_SIGNING_SECRET}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY}
      NODE_OPTIONS: --max-old-space-size=300
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    cpus: 0.5

  settlement:
    build: { context: .., dockerfile: ops/Dockerfile.go }
    restart: unless-stopped
    command: ["./settlement", "daemon"]
    # A redeploy sends SIGTERM; the daemon lets an in-flight batch transaction finish. Give it
    # 60 s (Docker's default is 10 s) before a forced kill; a killed batch rolls back whole.
    stop_grace_period: 60s
    environment:
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
      SETTLEMENT_INTERNAL_TOKEN: ${SETTLEMENT_INTERNAL_TOKEN}
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 128m
    cpus: 0.25

  reporting:
    build: { context: .., dockerfile: ops/Dockerfile.node }
    restart: unless-stopped
    command: ["npx", "tsx", "apps/reporting/src/index.ts"]
    environment:
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
      NODE_OPTIONS: --max-old-space-size=200
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 256m
    cpus: 0.25

  # HTTPS (Let's Encrypt, automatic) + the built web and admin apps + /v1 -> api.
  web:
    build:
      context: ..
      dockerfile: ops/Dockerfile.web
      args:
        DOMAIN: ${DOMAIN:?run ops/deploy.sh to create ops/.env.prod}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 64m
    cpus: 0.1

volumes:
  filspay_pgdata:
  caddy_data:
